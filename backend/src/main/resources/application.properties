spring.application.name=task-manager-backend
server.port=8080

# Active profile: 'dev' for zero-config H2 in-memory, 'mysql' for local/production MySQL
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA Settings
spring.jpa.open-in-view=false

# Security & JWT (256-bit secret key)
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=86400000

# Logging
logging.level.com.taskmanager=INFO
logging.level.org.springframework.security=INFO
